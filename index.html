<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0c315c">
  <meta name="robots" content="noindex, follow">
  <title>WESS AI 기술지원으로 이동</title>
  <link rel="icon" type="image/png" href="wessglobal-logo.png">
  <style>
    :root {
      --navy: #0c315c;
      --navy-dark: #072544;
      --green: #9bd321;
      --ink: #13243a;
      --muted: #5e6c7d;
      --line: #dce4ec;
      --surface: #ffffff;
      --background: #f3f6f9;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(12, 49, 92, 0.04), transparent 35%),
        var(--background);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, -apple-system, sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 7vw, 56px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(12, 49, 92, 0.09);
    }

    .logo {
      display: block;
      width: 116px;
      height: auto;
      margin: 0 auto 30px;
      image-rendering: auto;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy-dark);
      font-size: clamp(1.7rem, 6vw, 2.35rem);
      line-height: 1.28;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }

    .description {
      margin: 18px auto 28px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      text-wrap: pretty;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      color: #ffffff;
      background: var(--navy);
      border: 2px solid var(--navy);
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 800;
      text-decoration: none;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:hover {
      background: var(--navy-dark);
      border-color: var(--navy-dark);
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--green) 65%, white);
      outline-offset: 4px;
    }

    .status {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .progress {
      height: 3px;
      margin-top: 22px;
      overflow: hidden;
      background: #e9eef3;
      border-radius: 999px;
    }

    .progress::after {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      background: var(--green);
      transform: scaleX(0);
      transform-origin: left;
      animation: redirect-progress 1.6s linear forwards;
    }

    body.preview .progress::after {
      animation: none;
      transform: scaleX(1);
    }

    @keyframes redirect-progress {
      to { transform: scaleX(1); }
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      main { border-radius: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <img class="logo" src="wessglobal-logo.png" alt="WESSGLOBAL">
    <p class="eyebrow">WESS AI Technical Support</p>
    <h1 id="page-title">WESS AI 기술지원으로 이동합니다</h1>
    <p class="description">제품 설정, 배선, 보정 및 현장 점검 안내는 WESS AI 기술지원 사이트에서 이용할 수 있습니다.</p>
    <a class="button" id="open-wess-ai" href="https://ai.wessglobal.com/">WESS AI 기술지원 접속</a>
    <p class="status" id="redirect-status" aria-live="polite">잠시 후 자동으로 이동합니다.</p>
    <div class="progress" aria-hidden="true"></div>
    <noscript><p class="status">자동 이동을 사용할 수 없습니다. 위 버튼을 눌러 접속해 주세요.</p></noscript>
  </main>

  <script>
    (() => {
      const target = "https://ai.wessglobal.com/";
      const preview = new URLSearchParams(window.location.search).has("preview");
      const status = document.getElementById("redirect-status");

      if (preview) {
        document.body.classList.add("preview");
        status.textContent = "미리보기 모드입니다. 버튼을 누르면 WESS AI로 이동합니다.";
        return;
      }

      window.setTimeout(() => window.location.replace(target), 1600);
    })();
  </script>
</body>
</html>
